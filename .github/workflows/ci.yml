name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: |
          dotnet build src/ThaiWrap.Cli/ThaiWrap.Cli.csproj -c Release
          dotnet build tests/ThaiWrap.Tests/ThaiWrap.Tests.csproj -c Release

      - name: Build BepInEx plugin (net35)
        run: |
          ./tools/fetch-bepinex.sh
          dotnet build src/ThaiWrap.BepInEx/ThaiWrap.BepInEx.csproj -c Release

      # เทสเป็น console runner (ไม่ใช่ xunit) — exit code != 0 เมื่อมี check ใด fail
      - name: Run test suite
        run: dotnet run --project tests/ThaiWrap.Tests -c Release -- data/words_th.txt

      - name: CLI smoke test
        run: |
          # csv dry-run ต้องจบด้วย exit 0 และมี diff ให้ดู
          dotnet run --project src/ThaiWrap.Cli -c Release -- tests/samples/items.csv --columns thai --dry-run

          # ประมวลผลจริงแล้วตรวจว่ามี ZWSP ในผลลัพธ์
          dotnet run --project src/ThaiWrap.Cli -c Release -- tests/samples/dialogs.json -o /tmp/out.json
          python3 - <<'EOF'
          data = open('/tmp/out.json', encoding='utf-8').read()
          assert '\u200b' in data, 'no ZWSP found in output'
          assert '"name"' in data and '"desc"' in data, 'json structure lost'
          print('smoke ok: ZWSP present, structure intact')
          EOF

  package-test:
    # ทดสอบ "สิ่งที่ผู้ใช้ได้รับจริง": publish single-file แล้วรัน binary จากโฟลเดอร์ชั่วคราว
    # ครอบคลุม json (parser อิสระ) / CP874 / csv record / hairspace stats / inplace backup
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: windows-latest, rid: win-x64 }
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file CLI
        run: dotnet publish src/ThaiWrap.Cli/ThaiWrap.Cli.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o pkg

      - name: Package tests (binary จริงจากโฟลเดอร์ชั่วคราว)
        run: python tools/package_test.py pkg
